services:
  - type: cron
    name: security-scanner
    runtime: python
    region: frankfurt
    plan: starter
    schedule: "0 6 * * *"          # daily 06:00 UTC
    buildCommand: pip install -r requirements.txt
    startCommand: python check.py
    envVars:
      - key: PYTHON_VERSION
        value: "3.15.2"            # the scan reports it when a newer Python is out (scanner_deps.py)
      - key: RENDER_API_KEY
        sync: false                # set in the dashboard, never committed
      - key: GITHUB_TOKEN
        sync: false                # read-only (Contents: read) on commonknowledge repos, to read Blueprints' render.yaml
      - key: LINEAR_API_KEY
        sync: false                # read-only Linear key, to list the sites. Needed once WORDPRESS_CHECKS is on
      - key: CK_HEALTH_SIGNING_KEY
        sync: false                # Ed25519 key that signs requests to the CK Health plugin (.secrets/ck-health-signing-key)
      - key: SMTP2GO_API_KEY
        sync: false                # emails the daily digest to tech@. Without it, the digest is only printed
      - key: RENDER_OWNER_ID
        value: tea-clgi3lmg1b2c73a8u8mg  # environments must be protected in this workspace only
      - key: LOOSE_SCOPE
        value: owner               # all | owner
      - key: ALLOW_UNPROTECTED
        value: "evm-dajuht8ae00c73bf9fhg"  # ComSy / Production. Comma-separated environment ids allowed to stay unprotected
      - key: WORDPRESS_CHECKS
        value: "off"               # on | off. Off until every Linear project has its Live URL
      - key: MODE
        value: alert               # alert | protect
