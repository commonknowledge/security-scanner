# Opens PRs when the scanner's or the CK Health plugin's dependencies have updates. For the
# plugin, merge, bump the plugin version and tag a release: the daily digest lists it until the
# release is up to date. The digest also lists anything here that falls behind (scanner_deps.py).
version: 2
updates:
  - package-ecosystem: composer
    directory: /wp-plugin/ck-health
    schedule:
      interval: daily
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: daily
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
